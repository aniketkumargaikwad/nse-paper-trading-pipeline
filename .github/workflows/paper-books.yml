# The paper books (research/paper_books.py): every chosen strategy replayed forward
# from a fixed day on fresh prices. NO real money.
#
# Triggers are `schedule` and `workflow_dispatch` ONLY. Never add
# pull_request or pull_request_target: this repository is public.
name: paper-books

on:
  schedule:
    # 15:17 UTC = 20:47 IST: after the close, and after fno-daily (19:07 IST) has
    # fetched any option expiry that just ended.
    - cron: "17 15 * * 1-5"
  workflow_dispatch:

concurrency:
  group: paper-books
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  books:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FNO_ROOT: data/fno
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # For the options book only: the F&O store, and its facts rebuilt.
      - name: Fetch the F&O store from R2
        run: python scripts/fno_r2.py pull

      - name: Rebuild the BANKNIFTY facts
        run: python scripts/fno_features.py --only BANKNIFTY

      - name: Update the paper books
        run: python scripts/paper_books.py --notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}

      - name: Commit the books
        if: always()
        run: |
          git add research/journal/paper
          git -c user.name="paper books" -c user.email=noreply@anthropic.com \
            commit -m "docs(research): paper books $(date -u +%F)" || exit 0
          git pull --rebase -q && git push
