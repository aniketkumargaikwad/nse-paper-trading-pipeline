# Lot sizes by date (design 2026-10-02 sec 2.3). Generated by scripts/fno_lot_sizes.py,
# then each change checked against the NSE circular that announced it (5 Oct 2026).
#
# Each date is when the NEAR-MONTH contract took the new lot. NSE applies a
# revision to new contracts only, so for a few weeks the weeklies that were
# already listed keep the old lot (BANKNIFTY weeklies to 20 Jul 2023 stayed 25;
# NIFTY weeklies to 29 Jul 2021 stayed 75). Sizing is by margin, so a wrong lot
# in those weeks buys more or fewer sets of about the same rupee size. From
# 8 Jul 2024 every row in NSE's file carries its own lot and the engine uses it;
# the later dates here are a fallback only.
#
# The derivation agreed with NSE's own lot on all 2,780 overlap days.
BANKNIFTY:
- from: '2016-01-01'
  lot: 30
- from: '2016-07-01'      # 30 -> 40, NSE/F&O/034/2016, for contracts listed from 29 Apr 2016
  lot: 40
- from: '2018-10-26'      # 40 -> 20 from 26 Oct 2018 (Zerodha bulletin 199104)
  lot: 20
- from: '2020-06-26'      # 20 -> 25 from the July 2020 contracts
  lot: 25
- from: '2023-06-30'      # 25 -> 15, FAOP56233; derived 28 Jun (the June expiry itself), corrected
  lot: 15
- from: '2025-01-31'      # 15 -> 30, SEBI minimum contract value (Nov 2024), from the Feb 2025 monthly
  lot: 30
- from: '2025-06-26'      # 30 -> 35, June 2025 revision  # unconfirmed date
  lot: 35
- from: '2025-12-30'      # 35 -> 30, NSE circular 3 Oct 2025, after the 30 Dec 2025 expiry
  lot: 30
FINNIFTY:
- from: '2021-01-11'
  lot: 40
- from: '2024-06-26'      # 40 -> 25, NSE circular 2 Apr 2024 (July 2024 monthly)
