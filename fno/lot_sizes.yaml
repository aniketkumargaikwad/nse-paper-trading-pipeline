- from: '2025-01-31'      # unconfirmed
  lot: 65
- from: '2025-12-31'      # 65 -> 60, NSE circular 3 Oct 2025
  lot: 60
MIDCPNIFTY:
- from: '2022-01-24'
  lot: 75
- from: '2024-06-24'      # 75 -> 50, NSE circular 2 Apr 2024 (July 2024 monthly)
