# Market event days (design 2.1). kind: budget | rbi_policy | election_result.
# Budget and election-result dates are public record. RBI rows are every
# Monetary Policy Committee decision since the first MPC (Oct 2016), read on
# 4 Oct 2026 from RBI's own archive, financial-year tab named in `source`:
# the decision is announced on the last day of the meeting dates in RBI's
# minutes. Unscheduled decisions included (2020-03-27, 2020-05-22,
# 2022-05-04); the 3 Nov 2022 additional meeting made no rate decision and is
# left out. Pre-MPC 2016 policy days are not listed.
# Budget 2026 was presented on Sunday 1 Feb 2026; an event on a day with no
# session simply matches no trading day.
